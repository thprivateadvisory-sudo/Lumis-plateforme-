<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
:root{
  --void:#05060a;--deep:#0a0c12;--panel:#0f1219;--card:#141820;--raise:#1c2230;
  --w1:rgba(255,255,255,.07);--w2:rgba(255,255,255,.12);--w3:rgba(255,255,255,.2);
  --y:#d4ff00;--yd:rgba(212,255,0,.12);--yg:rgba(212,255,0,.06);
  --snow:#f0f2ff;--fog:#8892aa;--mist:#404860;--red:#ff3355;--blue:#4da6ff;
  --fh:'Bricolage Grotesque',sans-serif;
  --fi:'Instrument Serif',serif;
  --fm:'JetBrains Mono',monospace;
  --nav:68px;--ease:cubic-bezier(.16,1,.3,1);
}
body{background:var(--void);color:var(--snow);font-family:var(--fh);overflow-x:hidden;cursor:none;width:100%;max-width:100vw}
section,header,footer,nav,.page{overflow-x:hidden;max-width:100%}
.w{max-width:1200px;margin:0 auto;padding:0 44px}
.wm{max-width:860px;margin:0 auto;padding:0 44px}
.ws{max-width:640px;margin:0 auto;padding:0 44px}

/* CURSOR */
#cur{position:fixed;width:10px;height:10px;border-radius:50%;background:var(--y);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
#curo{position:fixed;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(212,255,0,.45);pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:400;height:var(--nav);display:flex;align-items:center;justify-content:space-between;padding:0 44px;border-bottom:1px solid transparent;transition:background .4s,border-color .4s}
#nav.sc{background:rgba(5,6,10,.92);border-bottom-color:var(--w1);backdrop-filter:blur(24px)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;text-decoration:none}
.logo-name{font-size:18px;font-weight:800;letter-spacing:-.035em;color:var(--snow)}
.logo-name .dot{color:var(--y)}
.nav-c{display:flex;align-items:center;gap:2px;position:absolute;left:50%;transform:translateX(-50%)}
.nl{padding:8px 15px;font-size:14px;font-weight:500;color:var(--fog);border-radius:8px;transition:all .2s;cursor:pointer;border:none;background:none;font-family:var(--fh)}
.nl:hover,.nl.on{color:var(--snow);background:var(--w1)}
.nav-r{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;font-family:var(--fh);font-weight:700;cursor:pointer;transition:all .22s var(--ease);text-decoration:none;border:none;white-space:nowrap;font-size:14px;padding:10px 22px}
.by{background:var(--y);color:#000}
.by:hover{background:#e0ff1a;box-shadow:0 0 0 4px rgba(212,255,0,.15),0 8px 30px rgba(212,255,0,.25);transform:translateY(-1px)}
.bg{background:transparent;color:var(--snow);border:1px solid var(--w2)}
.bg:hover{border-color:var(--w3);background:var(--w1)}
.blg{font-size:16px;padding:16px 38px;border-radius:14px}
.bsm{font-size:13px;padding:8px 18px;border-radius:8px}

/* PAGES SPA */
.page{display:none;padding-top:var(--nav);min-height:100vh}
.page.act{display:block}

/* ATOMS */
.sec{padding:108px 0}.secm{padding:64px 0}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--y);margin-bottom:16px}
.tag::before{content:'';width:20px;height:1px;background:var(--y);flex-shrink:0}
.h2{font-family:var(--fh);font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-bottom:18px}
.h2 em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--y)}
.lead{font-size:clamp(16px,2vw,19px);color:var(--fog);line-height:1.72;max-width:520px}
.txt{font-size:15px;color:var(--fog);line-height:1.72}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.py{background:var(--yd);color:var(--y);border:1px solid rgba(212,255,0,.2)}
.pb{background:rgba(77,166,255,.1);color:var(--blue);border:1px solid rgba(77,166,255,.2)}
.pr{background:rgba(255,51,85,.1);color:var(--red);border:1px solid rgba(255,51,85,.2)}

/* REVEAL */
.rv{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.rv.sh{opacity:1;transform:none}
.d1{transition-delay:.06s}.d2{transition-delay:.13s}.d3{transition-delay:.2s}

/* TOPBAR */
#topbar{background:var(--y);color:#000;padding:10px;text-align:center;font-size:13px;font-weight:700;position:relative;z-index:500;display:flex;align-items:center;justify-content:center;gap:10px}
#topbar a{color:#000;text-decoration:underline;cursor:pointer}
#tbc{position:absolute;right:16px;background:none;border:none;cursor:pointer;font-size:18px;color:#000;opacity:.6}

/* ── HERO ── */
#hero{min-height:calc(100vh - var(--nav));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 44px 60px;position:relative;overflow:hidden}
.hbg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hglow{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(212,255,0,.07) 0%,transparent 65%);filter:blur(50px);animation:gb 5s ease-in-out infinite}
@keyframes gb{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.hgrad{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(to top,var(--void),transparent)}
.hbadge{display:inline-flex;align-items:center;gap:9px;background:rgba(212,255,0,.07);border:1px solid rgba(212,255,0,.18);border-radius:100px;padding:8px 20px;margin-bottom:36px;font-size:13px;font-weight:600;color:var(--y);animation:fu .7s both}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--y);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
.hh1{font-family:var(--fh);font-size:clamp(52px,9vw,115px);font-weight:800;letter-spacing:-.05em;line-height:.92;animation:fu .7s .07s both}
.hh1 .plain{display:block;color:var(--snow)}
.hh1 .outline{display:block;-webkit-text-stroke:1.5px rgba(255,255,255,.2);color:transparent;font-family:var(--fi);font-style:italic;font-weight:400}
.hh1 .spark{display:block;background:linear-gradient(90deg,var(--y) 0%,#aaff00 50%,var(--y) 100%);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 3.5s linear infinite}
@keyframes shim{to{background-position:-200% center}}
@keyframes fu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.hdesc{font-size:clamp(16px,2vw,20px);color:var(--fog);max-width:560px;margin:28px auto 48px;line-height:1.7;animation:fu .7s .15s both}
.hdesc strong{color:var(--snow);font-weight:600}
.hctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fu .7s .22s both}
.htrust{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:24px;font-size:13px;color:var(--fog);animation:fu .7s .28s both;flex-wrap:wrap}
.tsep{width:4px;height:4px;border-radius:50%;background:var(--mist)}
.htrust strong{color:var(--snow)}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--w1);border-radius:20px;background:rgba(20,24,32,.75);backdrop-filter:blur(20px);overflow:hidden;margin-top:72px;animation:fu .7s .35s both}
.hs{padding:26px 28px;text-align:center;position:relative}
.hs+.hs::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:var(--w1)}
.hsv{font-family:var(--fh);font-size:clamp(22px,3vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1;display:block}
.hsv .y{color:var(--y)}
.hsl{font-size:12px;color:var(--fog);margin-top:5px;display:block;font-weight:500}

/* LOGOS MARQUEE */
.logos{padding:26px 0;border-top:1px solid var(--w1);border-bottom:1px solid var(--w1);background:var(--deep);overflow:hidden;position:relative}
.lfl,.lfr{position:absolute;top:0;bottom:0;width:100px;z-index:2;pointer-events:none}
.lfl{left:0;background:linear-gradient(90deg,var(--deep),transparent)}
.lfr{right:0;background:linear-gradient(-90deg,var(--deep),transparent)}
.llbl{text-align:center;font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.mq{display:flex;gap:52px;animation:mqs 26s linear infinite;white-space:nowrap}
.mq:hover{animation-play-state:paused}
.li{display:flex;align-items:center;gap:9px;flex-shrink:0;font-size:13px;font-weight:700;color:rgba(255,255,255,.22);transition:color .2s;cursor:default}
.li:hover{color:rgba(255,255,255,.55)}
@keyframes mqs{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* WHY */
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--w1);border:1px solid var(--w1);border-radius:22px;overflow:hidden;margin-top:52px}
.wcell{background:var(--panel);padding:46px 42px;position:relative;overflow:hidden;transition:background .3s}
.wcell:hover{background:var(--card)}
.wcell::after{content:attr(data-n);position:absolute;right:20px;top:-10px;font-size:120px;font-weight:800;color:rgba(212,255,0,.04);font-family:var(--fh);pointer-events:none;line-height:1;transition:color .3s}
.wcell:hover::after{color:rgba(212,255,0,.07)}
.wic{font-size:28px;margin-bottom:20px}
.wt{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.wd{font-size:14px;color:var(--fog);line-height:1.72}

/* TESTIMONIALS */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tc{background:var(--card);border:1px solid var(--w1);border-radius:20px;padding:30px;transition:all .3s}
.tc:hover{border-color:var(--w2);transform:translateY(-3px)}
.tst{color:var(--y);font-size:13px;letter-spacing:2px;margin-bottom:14px}
.tq{font-size:15px;line-height:1.72;color:var(--snow);margin-bottom:22px;font-style:italic}
.tp{display:flex;align-items:center;gap:12px}
.tav{width:44px;height:44px;border-radius:50%;background:var(--raise);border:1px solid var(--w2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.tn{font-size:14px;font-weight:700}
.tt{font-size:12px;color:var(--fog);margin-top:1px}

/* ── BENTO PRODUCTS ── */
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bc{background:var(--card);border:1px solid var(--w1);border-radius:22px;overflow:hidden;transition:all .35s var(--ease);cursor:pointer;position:relative}
.bc:hover{border-color:rgba(212,255,0,.25);transform:translateY(-5px);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.bw{grid-column:span 2}
.bvis{height:180px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bbody{padding:28px}
.btit{font-size:21px;font-weight:700;letter-spacing:-.025em;margin-bottom:8px}
.bdesc{font-size:14px;color:var(--fog);line-height:1.65}
.bprice{display:flex;align-items:baseline;gap:6px;margin-top:18px}
.pv{font-family:var(--fh);font-size:32px;font-weight:800;letter-spacing:-.04em}
.pu{font-size:13px;color:var(--fog)}
.bcta{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:700;color:var(--y);border:1px solid rgba(212,255,0,.2);border-radius:8px;padding:9px 18px;transition:all .2s;cursor:pointer;background:transparent;font-family:var(--fh)}
.bcta:hover{background:rgba(212,255,0,.08)}

/* ── PLANS ── */
.tglw{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:52px}
.tlbl{font-size:14px;font-weight:600;color:var(--fog)}
.tlbl.on{color:var(--snow)}
.tgl{width:52px;height:28px;border-radius:100px;background:var(--raise);border:1px solid var(--w2);position:relative;cursor:pointer;transition:background .2s}
.tgl.on{background:var(--y)}
.tglk{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--snow);transition:transform .2s,background .2s}
.tgl.on .tglk{transform:translateX(24px);background:#000}
.apill{background:rgba(212,255,0,.12);color:var(--y);font-size:11px;font-weight:700;padding:4px 12px;border-radius:100px;border:1px solid rgba(212,255,0,.2)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pbox{background:var(--card);border:1px solid var(--w1);border-radius:22px;padding:30px 26px;position:relative;transition:all .3s}
.pbox:hover{transform:translateY(-4px)}
.pf{border-color:rgba(212,255,0,.3);background:linear-gradient(160deg,rgba(212,255,0,.05) 0%,var(--card) 55%)}
.pbadge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--y);color:#000;font-size:11px;font-weight:800;padding:5px 16px;border-radius:100px;white-space:nowrap;letter-spacing:.04em}
.pname{font-size:12px;font-weight:700;color:var(--fog);text-transform:uppercase;letter-spacing:.1em;margin-bottom:18px}
.pamt{font-family:var(--fh);font-size:50px;font-weight:800;letter-spacing:-.05em;line-height:1}
.pamt sup{font-size:22px;vertical-align:super}
.pamt sub{font-size:16px;font-weight:500;color:var(--fog)}
.ppitch{font-size:14px;color:var(--fog);margin:12px 0 20px;line-height:1.65}
.psep{height:1px;background:var(--w1);margin:16px 0}
.plist{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.plist li{font-size:14px;display:flex;align-items:flex-start;gap:8px;color:var(--fog)}
.plist li.on{color:var(--snow)}
.ci{color:var(--y);flex-shrink:0;margin-top:1px}
.cx{color:var(--mist);flex-shrink:0;margin-top:1px}
.pbtn{width:100%;padding:13px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;font-family:var(--fh);transition:all .22s;text-align:center;display:block}
.pghost{background:transparent;border:1px solid var(--w2);color:var(--snow)}
.pghost:hover{background:var(--raise);border-color:var(--w3)}
.pyel{background:var(--y);border:none;color:#000}
.pyel:hover{background:#e0ff1a;box-shadow:0 0 30px rgba(212,255,0,.3)}

/* FAQ */
.faq{display:flex;flex-direction:column;border:1px solid var(--w1);border-radius:16px;overflow:hidden;margin-top:48px}
.fqi{border-bottom:1px solid var(--w1)}
.fqi:last-child{border-bottom:none}
.fqq{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;cursor:pointer;font-size:15px;font-weight:600;background:var(--card);transition:background .2s}
.fqq:hover{background:var(--raise)}
.fqico{font-size:18px;transition:transform .3s;color:var(--fog)}
.fqa{display:none;padding:0 24px 20px;font-size:14px;color:var(--fog);line-height:1.72;background:var(--card)}
.fqi.op .fqico{transform:rotate(45deg)}
.fqi.op .fqa{display:block}

/* ── AGENTS ── */
.afgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.afc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:44px}
.afb{padding:8px 20px;border-radius:100px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--w1);color:var(--fog);cursor:pointer;transition:all .2s;font-family:var(--fh)}
.afb:hover,.afb.on{background:var(--yd);border-color:rgba(212,255,0,.25);color:var(--y)}
.agc{background:var(--card);border:1px solid var(--w1);border-radius:20px;padding:26px;transition:all .3s var(--ease);position:relative;overflow:hidden}
.agc:hover{border-color:rgba(212,255,0,.2);transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.agc::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0 100%,rgba(212,255,0,.04),transparent 60%);opacity:0;transition:opacity .3s}
.agc:hover::before{opacity:1}
.agh{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.agav{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--raise);border:1px solid var(--w2);font-size:22px}
.agn{font-size:16px;font-weight:700;letter-spacing:-.01em}
.agr{font-family:var(--fm);font-size:11px;color:var(--y);margin-top:2px}
.aglv{width:7px;height:7px;border-radius:50%;background:var(--y);flex-shrink:0;animation:ping 2s infinite;margin-left:auto}
.agd{font-size:14px;color:var(--fog);line-height:1.65;margin-bottom:16px}
.agf{display:flex;align-items:center;justify-content:space-between}
.agp{font-family:var(--fh);font-size:22px;font-weight:800}
.agp sub{font-size:12px;font-weight:500;color:var(--fog)}
.agbt{font-size:13px;font-weight:700;color:var(--y);border:1px solid rgba(212,255,0,.2);border-radius:8px;padding:8px 16px;cursor:pointer;transition:all .2s;background:transparent;font-family:var(--fh)}
.agbt:hover{background:rgba(212,255,0,.08)}
.ags{display:flex;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--w1)}
.agst{font-size:12px;color:var(--fog)}
.agst b{color:var(--snow)}

/* ── INVEST ── */
.invgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.dash{background:var(--card);border:1px solid var(--w1);border-radius:24px;overflow:hidden}
.dht{padding:18px 22px;border-bottom:1px solid var(--w1);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.02)}
.dhtt{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.liv{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;color:var(--y)}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--y);animation:ping 2s infinite}
.dport{padding:22px}
.ptlb{font-size:12px;color:var(--fog);margin-bottom:3px}
.ptlv{font-family:var(--fh);font-size:38px;font-weight:800;letter-spacing:-.04em}
.ptlc{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:14px;margin-bottom:20px}
.ptlu{color:var(--y);font-weight:700}
.ptlp{color:var(--fog);font-size:12px}
.cwrap{height:130px;position:relative;margin-bottom:18px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.02)}
.alist{display:flex;flex-direction:column;gap:13px}
.ast{display:flex;align-items:center;gap:13px}
.aic{width:40px;height:40px;border-radius:10px;background:var(--raise);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.ain{flex:1}
.an{font-size:14px;font-weight:600}
.asb{font-size:12px;color:var(--fog)}
.ar{text-align:right}
